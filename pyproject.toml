# Packaging for the `stagr` CLI. `pipx install stagr` (once published) or, from a checkout,
# `pipx install .`, gives a `stagr` command on Linux, macOS and Windows.
#
# The toolkit's data (config.schema.json + the templates/ tree) lives INSIDE the `stagr`
# package, so it ships in the wheel and resolves the same way in a source checkout and when
# installed — no repository layout is assumed at runtime.
[build-system]
# Pin the build backend AND its full transitive closure, so the isolated build environment that
# `python -m build` (and `pip install .`) creates resolves NOTHING at latest — every build on the
# hosted runner installs exactly these versions. Supply-chain hardening; refresh the pins together
# with a `uv pip compile hatchling==<new>` when bumping the backend.
requires = [
  "hatchling==1.32.4",
  "packaging==26.3",
  "pathspec==1.1.1",
  "pluggy==1.6.0",
  # hatchling pulls tomli only on Python < 3.11 (stdlib tomllib is used from 3.11 on).
  "tomli==2.4.1; python_version < '3.11'",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.9.21.13",
]
build-backend = "hatchling.build"

[project]
name = "stagr"
dynamic = ["version"]
description = "A control plane that turns one declarative file into a governed, multi-stage agentic SDLC pipeline on your existing CI/SCM."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6",
  "jsonschema>=4",
]
keywords = ["agentic", "sdlc", "ci", "pipeline", "control-plane", "codex", "code-review"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Build Tools",
  "Intended Audience :: Developers",
  # Source-available under the Business Source License 1.1 (not an OSI-approved license).
  "License :: Other/Proprietary License",
]

[project.scripts]
stagr = "stagr.cli:main"

[project.urls]
Repository = "https://github.com/exepex/agentic-foundation"

[tool.hatch.version]
path = "stagr/__init__.py"

[tool.hatch.build.targets.wheel]
# Ship the code AND its data (schema + templates) as one importable package.
packages = ["stagr"]

[tool.hatch.build.targets.sdist]
# The source distribution carries the package plus what a contributor needs to validate it.
include = [
  "stagr/",
  "docs/",
  "README.md",
  "CHANGELOG.md",
  "AGENTS.md",
  "CLAUDE.md",
  "LICENSE",
]
