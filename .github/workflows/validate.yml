name: Validate

# The repository's "green" check (equivalent to a unit-test suite for this contract/docs repo).
# Publishes the `Validate` check-run that the foundation auto-merge gate requires. Runs on PRs and
# on pushes to the default branch. It checks out only trusted repo content and uses no secrets.
on:
  pull_request:
    # `edited` is included so a base-retarget (which arrives as an edited event, not
    # synchronize) re-runs validation against the NEW base — otherwise the auto-merge gate
    # could accept a Validate result produced against the previous base. The job guard below
    # ignores edited events that are not a base change (title/body edits).
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  # Real validation runs (push, synchronize, base-change edited, …) share the per-PR group, so a
  # newer run supersedes an older one via cancel-in-progress. A metadata-only `edited` event
  # (title/body — which the job below skips) is instead given a unique per-run group, so it can
  # never cancel an in-flight real Validate run and leave the head with no successful result — a
  # cancellation that would otherwise stall the fail-closed auto-merge gate until the next
  # validation-triggering event.
  group: >-
    validate-${{ github.event.pull_request.number || github.ref }}${{
      (github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base == null)
      && format('-meta-{0}', github.run_id) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    # The job name IS the check-run name the auto-merge gate requires by name ("Validate").
    # Keep it exactly "Validate" (the descriptive detail lives in the step name below).
    name: Validate
    # Skip metadata-only edited events (only re-run on base changes); always run otherwise.
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install validators
        run: |
          python -m pip install --only-binary=:all: jsonschema pyyaml

      - name: Validate contract
        run: |
          python .github/scripts/validate_config.py

      - name: Neutral core & CLI unit tests
        run: |
          python .github/scripts/test_core.py
          python .github/scripts/test_cli.py

      - name: Build the package and smoke-test the installed CLI
        run: |
          set -euo pipefail
          # Pin the build frontend AND its full closure so this install resolves nothing at latest
          # on the runner (Python 3.12). The build BACKEND closure is pinned separately in
          # pyproject.toml [build-system].requires.
          python -m pip install --only-binary=:all: "build==1.6.1" "packaging==26.3" "pyproject-hooks==1.3.3"
          python -m build
          # Install the built wheel into an isolated venv and confirm the `stagr` command works
          # AND finds its bundled data (the config schema, the skills) from site-packages — run it
          # from a temp dir so cwd is not this repository.
          python -m venv /tmp/stagr-ci-venv
          /tmp/stagr-ci-venv/bin/pip install --quiet dist/stagr-*.whl
          /tmp/stagr-ci-venv/bin/stagr help >/dev/null
          # Plan this repository's own config from the installed wheel: proves the packaged schema,
          # renderers and skills work together, and (being `plan`) writes nothing.
          /tmp/stagr-ci-venv/bin/stagr plan --root "$GITHUB_WORKSPACE" >/dev/null
          # Onboard an empty repository the way a new team does: init, then plan.
          ( cd "$(mktemp -d)" && /tmp/stagr-ci-venv/bin/stagr init --app-id 1 >/dev/null \
            && /tmp/stagr-ci-venv/bin/stagr plan >/dev/null )
          ( cd "$(mktemp -d)" && /tmp/stagr-ci-venv/bin/python -c "
          from stagr.core.config_validation import SCHEMA_PATH, load_schema
          assert SCHEMA_PATH.is_file() and load_schema()['title']
          from pathlib import Path
          import stagr
          assert (Path(stagr.__file__).parent / 'templates' / 'skills' / 'code-review' / 'SKILL.md').is_file()
          " )
          echo "stagr wheel builds and runs from an isolated install."
